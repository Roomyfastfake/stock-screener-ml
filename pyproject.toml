[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backtester"
version = "0.1.0"
description = "Cross-sectional portfolio backtesting engine with no-lookahead timing tests"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas"]

[tool.setuptools]
packages = ["backtester"]
