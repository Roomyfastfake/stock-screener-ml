name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      # The live parity test compares against stock-screener-ml's backtest.py.
      - uses: actions/checkout@v5
        with:
          repository: Roomyfastfake/stock-screener-ml
          ref: main
          path: stock-screener-ml
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run tests (including live screener parity)
        env:
          SCREENER_PATH: ${{ github.workspace }}/stock-screener-ml
        run: python tests/test_backtester.py
      - name: Demo smoke test
        run: python examples/demo.py demo.html
