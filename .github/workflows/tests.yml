name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import sys, numpy, pandas; print(sys.version, numpy.__version__, pandas.__version__)"
      - name: Run offline test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/test_screener.py
      - name: CLI smoke test (synthetic, no network)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python main.py demo --top-n 5
          python main.py backtest --synthetic --bayes --top-n 5
