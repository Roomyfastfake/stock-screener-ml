name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./packages/backtester
          python -c "import sys, numpy, pandas; print(sys.version, numpy.__version__, pandas.__version__)"
      - name: Screener tests (offline; includes cross-engine parity)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/test_screener.py
      - name: Backtester tests (includes live parity with screener/backtest.py)
        run: python packages/backtester/tests/test_backtester.py
      - name: CLI smoke tests (synthetic, no network)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python main.py demo --top-n 5
          python main.py backtest --synthetic --bayes --top-n 5
          python main.py backtest --synthetic --engine backtester --short-n 3 --weighting inverse_vol
          python packages/backtester/examples/demo.py demo.html
